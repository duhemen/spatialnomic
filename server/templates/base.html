<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0A0E17" />
<title>{% block title %}SpatiaNomics{% endblock %}</title>
<link rel="manifest" href="/static/manifest.json" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="/static/css/style.css" />
{% block extra_head %}{% endblock %}
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">🌐</span>
    <span class="brand-name">SpatiaNomics</span>
    <span class="badge-version">v0.1.0</span>
  </div>
  <nav class="nav">
    <a href="/dashboard" class="{% if active == 'dashboard' %}active{% endif %}">🏙️ Dashboard</a>
    <a href="/peta" class="{% if active == 'peta' %}active{% endif %}">🗺️ Peta</a>
    <a href="/prediksi" class="{% if active == 'prediksi' %}active{% endif %}">📈 Prediksi</a>
    <a href="/laporan" class="{% if active == 'laporan' %}active{% endif %}">📋 Laporan</a>
  </nav>
  <div class="status" id="server-status">🟢 online</div>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>

<footer class="footer">
  <span>SpatiaNomics © 2026 — diary book of @duhemen</span>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="/static/js/common.js"></script>
{% block extra_scripts %}{% endblock %}

</body>
</html>
