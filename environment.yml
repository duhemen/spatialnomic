name: spatialnomic
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy>=1.26
  - pandas>=2.1
  - scipy>=1.11
  - scikit-learn>=1.4
  - statsmodels>=0.14
  - matplotlib>=3.8
  - seaborn>=0.13
  - jupyter
  - pip:
      # Server
      - fastapi==0.115.0
      - uvicorn[standard]==0.32.0
      - pydantic==2.9.2
      - python-multipart
      - python-jose[cryptography]
      - passlib[bcrypt]
      - sqlalchemy==2.0.35
      - apscheduler==3.10.4
      - httpx==0.27.2
      - requests==2.32.3
      - python-telegram-bot==21.6
      - jinja2==3.1.4
      - reportlab==4.2.5
      - openpyxl==3.1.5
      # ML
      - torch==2.4.1
      - shap==0.46.0
      # Client
      - PyQt6==6.7.1
      - PyQt6-WebEngine==6.7.0
      - pyqtgraph==0.13.7
      # Utils
      - python-dotenv==1.0.1
      - loguru==0.7.2
      - tqdm==4.66.5